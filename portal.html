<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Echelon Portal</title>
  <meta name="description" content="Sign-in for Echelon Members, the Echelon team and ambassadors." />
  <link rel="icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/portal.css" />
</head>
<body>
  <header class="p-top">
    <a href="/" class="p-logo" aria-label="Echelon Exotic &amp; Luxury home">
      <span class="p-logo-mark">ECHELON</span>
      <span class="p-logo-sub" id="logoSub">Portal</span>
    </a>
    <div class="p-user" id="userBar" hidden>
      <span class="p-user-name" id="userName"></span>
      <span class="p-chip" id="userRole"></span>
      <button type="button" class="p-link" id="signOut">Sign out</button>
    </div>
  </header>

  <main class="p-main">
    <!-- Sign in / set password -->
    <section class="p-auth" id="authView" hidden>
      <div class="p-auth-card">
        <p class="p-eyebrow" id="authEyebrow">Team &amp; Ambassadors</p>
        <h1 class="p-title" id="authTitle">Sign in</h1>
        <p class="p-muted" id="authLead">Sign in with the email Echelon added you with.</p>

        <form id="loginForm" class="p-form" novalidate>
          <label>Email<input type="email" name="email" autocomplete="username" required /></label>
          <label>Password<input type="password" name="password" autocomplete="current-password" required /></label>
          <button type="submit" class="p-btn p-btn--gold">Sign in</button>
          <button type="button" class="p-link" data-auth="forgot">Forgot your password?</button>
        </form>

        <form id="forgotForm" class="p-form" novalidate hidden>
          <label>Email<input type="email" name="email" autocomplete="username" required /></label>
          <button type="submit" class="p-btn p-btn--gold">Email me a link</button>
          <p class="p-muted p-small" id="forgotNote">No email? Ask an Echelon team member to text you a setup link.</p>
          <button type="button" class="p-link" data-auth="login">Back to sign in</button>
        </form>

        <form id="setupForm" class="p-form" novalidate hidden>
          <label>New password<input type="password" name="password" autocomplete="new-password" minlength="10" required /></label>
          <label>Confirm password<input type="password" name="confirm" autocomplete="new-password" minlength="10" required /></label>
          <button type="submit" class="p-btn p-btn--gold">Save and sign in</button>
        </form>

        <p class="p-error" id="authError" role="alert"></p>
        <p class="p-muted p-small p-auth-foot" id="authFoot" hidden></p>
      </div>
    </section>

    <!-- Echelon CRM (owners + employees) -->
    <section id="staffView" hidden>
      <nav class="p-tabs" id="staffTabs" role="tablist">
        <button type="button" role="tab" data-tab="reservations">Reservations</button>
        <button type="button" role="tab" data-tab="members">Members</button>
        <button type="button" role="tab" data-tab="requests">Requests<span class="p-tab-count" id="reqCount" hidden></span></button>
        <button type="button" role="tab" data-tab="referrals">Referrals</button>
        <button type="button" role="tab" data-tab="ambassadors" data-owner>Ambassadors</button>
        <button type="button" role="tab" data-tab="applications" data-owner>Applications<span class="p-tab-count" id="appCount" hidden></span></button>
        <button type="button" role="tab" data-tab="team" data-owner>Team</button>
      </nav>
      <div id="staffPanel" class="p-panel"></div>
    </section>

    <!-- Ambassador dashboard (ambassadors; owners can preview anyone's) -->
    <section id="ambView" hidden>
      <div class="p-preview-bar" id="previewBar" hidden>
        <span>Previewing <strong id="previewName"></strong>'s dashboard (what they see)</span>
        <button type="button" class="p-btn p-btn--ghost p-btn--sm" id="previewBack">Back to Ambassadors</button>
      </div>
      <div id="ambPanel" class="p-panel"></div>
    </section>

    <!-- Member area (/member): card, drives, concierge, requests (member-app.js) -->
    <section id="memberView" hidden></section>

    <div class="p-loading" id="loading" hidden><span></span></div>
  </main>

  <div class="p-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/member-app.js"></script>
  <script src="/portal-app.js"></script>
</body>
</html>
